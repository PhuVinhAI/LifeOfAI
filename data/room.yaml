    x: 0
    y: 0
    traits: [usable, breakable, container]
    traitConfig:
      container:
        slots: 10
        accepts: [food, drink]
      containerData:
        items:
          - { name: "Pizza", quantity: 2 }
          - { name: "Nước suối", quantity: 3 }
